<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>enpe5v3 — Games</title>
<style>
  :root {
    --felt-dark: #0b3d2e;
    --felt: #12523f;
    --gold: #e8c56b;
    --gold-soft: #f3dfa3;
    --text: #f4f1e8;
    --text-muted: #b9c9c0;
    --card-bg: #0f4536;
    --border: rgba(232, 197, 107, 0.25);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    background:
      radial-gradient(circle at 50% -10%, var(--felt) 0%, var(--felt-dark) 55%, #06251c 100%);
    display: flex;
    justify-content: center;
    padding: 64px 20px;
  }
  .wrap { max-width: 640px; width: 100%; }
  .suits {
    font-size: 22px;
    letter-spacing: 14px;
    color: var(--gold);
    opacity: 0.85;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 34px;
    margin: 0 0 8px;
    letter-spacing: 0.5px;
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline {
    font-size: 16px;
    color: var(--text-muted);
    margin: 0 0 40px;
  }
  h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gold);
    margin: 0 0 16px;
  }
  .game-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .game-name {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 4px;
  }
  .game-desc {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0;
  }
  .game-card a {
    flex-shrink: 0;
    color: var(--felt-dark);
    background: var(--gold);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 8px;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .game-card a:hover { background: var(--gold-soft); transform: translateY(-1px); }
  footer {
    margin-top: 56px;
    font-size: 12px;
    color: var(--text-muted);
    opacity: 0.7;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="suits">♠ ♥ ♦ ♣</div>
  <h1>enpe5v3</h1>
  <p class="tagline">Independent mobile game developer.</p>

  <h2>Games</h2>
  <div class="game-card">
    <div>
      <p class="game-name">Solitaire Collection</p>
      <p class="game-desc">Klondike, Spider &amp; Yukon in one app</p>
    </div>
    <a href="/solitaire-collection/privacy.html">Privacy Policy</a>
  </div>

  <footer>© 2026 enpe5v3</footer>
</div>

</body>
</html>
