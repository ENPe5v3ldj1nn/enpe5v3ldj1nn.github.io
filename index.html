<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molfar Digital — Games</title>
<style>
  :root {
    --bg: #f7f7f8;
    --text: #1c1c1e;
    --text-muted: #6b6b70;
    --card-bg: #ffffff;
    --border: #e3e3e6;
    --accent: #3a5aff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    background: var(--bg);
    display: flex;
    justify-content: center;
    padding: 64px 20px;
  }
  .wrap { max-width: 600px; width: 100%; }
  h1 {
    font-size: 28px;
    margin: 0 0 8px;
    letter-spacing: 0.2px;
  }
  .tagline {
    font-size: 15px;
    color: var(--text-muted);
    margin: 0 0 40px;
  }
  h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin: 0 0 14px;
  }
  .game-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    text-decoration: none;
    color: inherit;
  }
  .game-card:hover { border-color: var(--accent); }
  .game-name {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .game-desc {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0;
  }
  .arrow { color: var(--accent); flex-shrink: 0; font-size: 18px; }
  .support {
    margin-top: 40px;
  }
  .support a { color: var(--accent); text-decoration: none; }
  .support a:hover { text-decoration: underline; }
  footer {
    margin-top: 56px;
    font-size: 12px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>Molfar Digital</h1>
  <p class="tagline">Independent mobile game developer.</p>

  <h2>Games</h2>
  <a class="game-card" href="/yukon-solitaire/">
    <div>
      <p class="game-name">Yukon Solitaire: Move Any Card</p>
      <p class="game-desc">No stock pile. Move any face-up card with the pile on top of it.</p>
    </div>
    <span class="arrow">→</span>
  </a>

  <h2 style="margin-top:40px;">Support</h2>
  <div class="support">
    <a href="mailto:enpe5v3ldj1nnhelper@gmail.com">enpe5v3ldj1nnhelper@gmail.com</a>
  </div>

  <footer>© 2026 Molfar Digital</footer>
</div>

</body>
</html>
